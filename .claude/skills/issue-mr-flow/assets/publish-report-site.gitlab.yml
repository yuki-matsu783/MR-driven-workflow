# 報告サイトの公開（issue #114）— GitLab CI 版
#
# `reports/*.html` `plans/*.html`（人間レビュー用のHTMLビュー）を GitLab Pages の
# `mr-<MR iid>/` へデプロイし、ブラウザで開けるURLを払い出す。URLの提示は
# issue-mr-flow の flow-id 5-6 が `get_report_site_url` で行う。
#
# **配布先で知っておくことの正は `.claude/skills/issue-mr-flow/SKILL.md`
#   「報告サイトのホストとURL通知（flow-id 5-4・5-6）」節の「使う前に知っておくこと」表である。**
# ここへ同じ内容を書き写さない（雛形と実ファイルのバイト一致はテストが守るが、SKILL.md との
# 一致は誰も見ていないため、二重に書くと片方だけが古くなる）。このヘッダが持つのは
# **このファイルを置くときに手を入れる箇所**だけに留める。
#
# **このファイルを置くときに手を入れる箇所**
#   1. `pages.path_prefix` による並列デプロイ（parallel deployments）は
#      **Premium / Ultimate 限定**である（GitLab 17.9 でGA）。**Free tier / CE では
#      `pages:` ブロックごと削る**（`path_prefix` と `expire_in` の2行）。削らないと
#      `pages` ジョブが失敗し、MRのパイプラインが赤くなる。単一デプロイになるため、
#      複数MRが同時に走ると後のものが前を上書きする点は受け入れる。
#   2. Runner を登録し、Pages を有効にしておく。
#   3. 既に `.gitlab-ci.yml` を持つ配布先では、この `pages` ジョブだけを既存の設定へ取り込む。
#
# **ホストしたHTMLは、プロジェクトの可視性設定に従う**（GitHub版とここが違う）。
# この1行だけは SKILL.md と重複して置く（置く前に読まれるべき安全上の注意であり、
# 見落としたときの損失が大きいため。意図的な重複であって、上の「書き写さない」の例外である）。

pages:
  stage: deploy
  # MRパイプラインのときだけ走らせる。$CI_MERGE_REQUEST_IID はこの条件下でのみ値を持つ。
  # **path_prefix が空文字列へ展開されると本番サイトのルートを上書きする**ため、
  # この rules を緩めないこと。
  #
  # **対象HTMLが0件のときは、ジョブ自体を作らせない**（`exists` は `if` とANDで効く）。
  # ここを script 内の `exit 0` で済ませてはいけない——GitLab Runner は script を1つの
  # シェルスクリプトへ連結して実行するため、`exit 0` はジョブを「成功」で終わらせ、
  # **空の public がそのまま artifacts としてアップロードされ、直前まで開けていた
  # mr-<iid>/ を空（404）に置き換える**。flow-id 5-5 の片付けを反映した直後、つまり
  # flow-id 5-6 でユーザーへURLを提示するその瞬間に起きる（issue #114 の敵対的レビュー）。
  # GitHub版は `deploy=false` で以降のstepごとスキップするので gh-pages を一切触らない。
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      exists:
        - reports/*.html
        - plans/*.html
  pages:
    path_prefix: "mr-$CI_MERGE_REQUEST_IID"
    # 既定は24時間。レビューが翌日以降になると提示済みのURLが開けなくなり、GitHub側
    # （無期限）と挙動が食い違うため、寿命を揃える。
    expire_in: never
  script:
    - mkdir -p public/reports public/plans
    - |
      # 0件のガードは上の rules.exists が持つ（script 内で判定しないこと。上のコメント参照）。
      # ここは「rules を通ったのに0件だった」という想定外の状態を検出するためだけの表明で、
      # 空の public をアップロードさせないよう**失敗させる**。
      html_count=0
      for f in reports/*.html plans/*.html; do
        [ -e "$f" ] || continue
        html_count=$((html_count + 1))
      done
      if [ "$html_count" = "0" ]; then
        echo "rules.exists を通ったのに対象HTMLが0件です（想定外）" >&2
        exit 1
      fi
      echo "対象HTML ${html_count} 件をデプロイします"
      for f in reports/*.html; do [ -e "$f" ] || continue; cp "$f" public/reports/; done
      for f in plans/*.html; do [ -e "$f" ] || continue; cp "$f" public/plans/; done
    - |
      # Pages はディレクトリ一覧を自動生成しない。index.html が無いと mr-<iid>/ を開いても
      # 404 になり、flow-id 5-6 で提示するURLが機能しない。
      {
        printf '<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="UTF-8">\n'
        printf '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
        printf '<title>MR !%s の計画・レポート</title>\n' "$CI_MERGE_REQUEST_IID"
        printf '<style>body{font-family:system-ui,sans-serif;line-height:1.8;max-width:900px;'
        printf 'margin:0 auto;padding:24px}h1{font-size:22px}h2{font-size:17px;margin-top:28px}'
        printf 'li{margin:4px 0}</style>\n</head>\n<body>\n'
        printf '<h1>MR !%s の計画・レポート</h1>\n' "$CI_MERGE_REQUEST_IID"
        printf '<p>コミット <code>%s</code> 時点。squash merge により default ブランチには残らないため、' "$CI_COMMIT_SHA"
        printf 'レビュー期間中の閲覧用に公開しています。</p>\n'
        for dir in reports plans; do
          found=0
          for f in "public/$dir"/*.html; do [ -e "$f" ] || continue; found=1; done
          [ "$found" = "1" ] || continue
          printf '<h2>%s/</h2>\n<ul>\n' "$dir"
          for f in "public/$dir"/*.html; do
            [ -e "$f" ] || continue
            name="${f##*/}"
            # ファイル名は日本語・【】・記号を含みうる。**素のまま埋め込まない。**
            # href は壊れる文字だけを%エンコードし、表示テキストは HTML エスケープする。
            # どちらも置換の順序が効く（`%` を最初に、`&` を `<` `>` より先に。
            # 逆にすると二重エンコード・二重エスケープになる）。
            #
            # **bash の `${v//a/b}` を使わない。** 置換文字列中の `&` の扱いが
            # bash 5.2 で変わっており（マッチ全体へ展開される）、`\&` での退避が
            # 5.1 以前と互換でない。GitLab 側は shell が bash とも限らない。
            # sed なら `&` の意味も `\&` での退避も、処理系をまたいで定まっている。
            enc="$(printf '%s' "$name" | sed -e 's/%/%25/g' -e 's/&/%26/g' \
              -e 's/#/%23/g' -e 's/?/%3F/g' -e 's/"/%22/g' \
              -e 's/</%3C/g' -e 's/>/%3E/g' -e 's/ /%20/g')"
            esc="$(printf '%s' "$name" | sed -e 's/&/\&amp;/g' \
              -e 's/</\&lt;/g' -e 's/>/\&gt;/g')"
            printf '<li><a href="%s/%s">%s</a></li>\n' "$dir" "$enc" "$esc"
          done
          printf '</ul>\n'
        done
        printf '</body>\n</html>\n'
      } > public/index.html
  artifacts:
    paths:
      - public
