# 報告サイトの公開（issue #114）— GitHub Actions 版
#
# `reports/*.html` `plans/*.html`（人間レビュー用のHTMLビュー）を GitHub Pages の
# `pr-<PR番号>/` へデプロイし、ブラウザで開けるURLを払い出す。URLの提示は
# issue-mr-flow の flow-id 5-6 が `get_report_site_url` で行う。
#
# **配布先で知っておくことの正は `.claude/skills/issue-mr-flow/SKILL.md`
#   「報告サイトのホストとURL通知（flow-id 5-4・5-6）」節の「使う前に知っておくこと」表である。**
# ここへ同じ内容を書き写さない（雛形と実ファイルのバイト一致はテストが守るが、SKILL.md との
# 一致は誰も見ていないため、二重に書くと片方だけが古くなる）。このヘッダが持つのは
# **このファイルを置くときに手を入れる箇所**だけに留める。
#
# **このファイルを置くときに手を入れる箇所**
#   1. `on.push.branches` を `.mrworkflow.json` の `branchPrefixTemplate` に合わせる。
#      既定は `feature-<issue番号>-<slug>` なので `feature-*` にしてある。
#   2. リポジトリ設定で Pages を有効にし、publishing source を `gh-pages` / `/`（root）にする。
#      `gh api -X POST repos/{owner}/{repo}/pages -f 'source[branch]=gh-pages' -f 'source[path]=/'`
#
# **ホストしたHTMLは、リポジトリが private でもインターネットに公開される。**
# この1行だけは SKILL.md と重複して置く（置く前に読まれるべき安全上の注意であり、
# 見落としたときの損失が大きいため。意図的な重複であって、上の「書き写さない」の例外である）。

name: publish-report-site

on:
  push:
    # paths フィルタは付けない。flow-id 5-5 の片付けで対象HTMLが全部消えた変更も拾い、
    # 「0件ならスキップ」で無害化する必要があるため（フィルタを付けると発火自体しない）。
    branches: ['feature-*']

concurrency:
  # PR単位でグループを分ける。リポジトリ全体で1つにすると、同じグループで保持される
  # 待機中の実行は「1件」だけなので、3つ目がキューされた時点で中間のデプロイが取り消される
  # （cancel-in-progress: false はこの取り消しを防がない）。
  # 別PR同士の gh-pages への書き込みは並走しうるが、その競合は下の pull --rebase リトライが吸収する。
  group: gh-pages-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得する
        uses: actions/checkout@v4

      - name: デプロイ対象かどうかを判定する
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 判定1: openなPRがちょうど1件か（0件＝PR作成前、複数件＝どれへ載せるか決まらない）
          count="$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq 'length')"
          if [ "$count" != "1" ]; then
            echo "openなPRが ${count} 件のためスキップします"
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number="$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')"

          # 判定2: 対象HTMLが1件以上あるか。0件ならスキップする。
          # **これが flow-id 5-5 の片付けを無害化する仕掛けである**（gh-pages 側の pr-<n>/ は
          # 触られないので残る）。
          html_count=0
          for f in reports/*.html plans/*.html; do
            [ -e "$f" ] || continue
            html_count=$((html_count + 1))
          done
          if [ "$html_count" = "0" ]; then
            echo "対象HTMLが0件のためスキップします（既存の pr-${number}/ はそのまま残ります）"
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "PR #${number} / 対象HTML ${html_count} 件をデプロイします"
          echo 'deploy=true' >> "$GITHUB_OUTPUT"
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: 成果物を集めて index.html を作る
        if: steps.guard.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/site"
          mkdir -p "$out/reports" "$out/plans"
          for f in reports/*.html; do [ -e "$f" ] || continue; cp "$f" "$out/reports/"; done
          for f in plans/*.html; do [ -e "$f" ] || continue; cp "$f" "$out/plans/"; done

          # Pages はディレクトリ一覧を自動生成しない。index.html が無いと pr-<n>/ を開いても
          # 404 になり、flow-id 5-6 で提示するURLが機能しない。
          {
            printf '<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="UTF-8">\n'
            printf '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
            printf '<title>PR #%s の計画・レポート</title>\n' "${{ steps.guard.outputs.number }}"
            printf '<style>body{font-family:system-ui,sans-serif;line-height:1.8;max-width:900px;'
            printf 'margin:0 auto;padding:24px}h1{font-size:22px}h2{font-size:17px;margin-top:28px}'
            printf 'li{margin:4px 0}</style>\n</head>\n<body>\n'
            printf '<h1>PR #%s の計画・レポート</h1>\n' "${{ steps.guard.outputs.number }}"
            printf '<p>コミット <code>%s</code> 時点。squash merge により main には残らないため、' "$GITHUB_SHA"
            printf 'レビュー期間中の閲覧用に公開しています。</p>\n'
            for dir in reports plans; do
              found=0
              for f in "$out/$dir"/*.html; do [ -e "$f" ] || continue; found=1; done
              [ "$found" = "1" ] || continue
              printf '<h2>%s/</h2>\n<ul>\n' "$dir"
              for f in "$out/$dir"/*.html; do
                [ -e "$f" ] || continue
                name="${f##*/}"
                # ファイル名は日本語・【】・記号を含みうる。**素のまま埋め込まない。**
                # href は壊れる文字だけを%エンコードし、表示テキストは HTML エスケープする。
                # どちらも置換の順序が効く（`%` を最初に、`&` を `<` `>` より先に。
                # 逆にすると二重エンコード・二重エスケープになる）。
                #
                # **bash の `${v//a/b}` を使わない。** 置換文字列中の `&` の扱いが
                # bash 5.2 で変わっており（マッチ全体へ展開される）、`\&` での退避が
                # 5.1 以前と互換でない。GitLab 側は shell が bash とも限らない。
                # sed なら `&` の意味も `\&` での退避も、処理系をまたいで定まっている。
                enc="$(printf '%s' "$name" | sed -e 's/%/%25/g' -e 's/&/%26/g' \
                  -e 's/#/%23/g' -e 's/?/%3F/g' -e 's/"/%22/g' \
                  -e 's/</%3C/g' -e 's/>/%3E/g' -e 's/ /%20/g')"
                esc="$(printf '%s' "$name" | sed -e 's/&/\&amp;/g' \
                  -e 's/</\&lt;/g' -e 's/>/\&gt;/g')"
                printf '<li><a href="%s/%s">%s</a></li>\n' "$dir" "$enc" "$esc"
              done
              printf '</ul>\n'
            done
            printf '</body>\n</html>\n'
          } > "$out/index.html"

      - name: gh-pages へ反映する
        if: steps.guard.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          number='${{ steps.guard.outputs.number }}'
          out="$RUNNER_TEMP/site"
          work="$RUNNER_TEMP/gh-pages"

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # gh-pages が無ければ orphan として作る（初回はブランチが存在しない）
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$work"
          else
            git clone --depth 1 \
              "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$work"
            git -C "$work" switch --orphan gh-pages
            git -C "$work" rm -rf . >/dev/null 2>&1 || true
          fi

          # pr-<n>/ を作り直してコミットする。押し出しに失敗して取り込み直したあとにも
          # そのまま使えるよう関数にしておく（同じ手順を2箇所に書かないため）。
          #   0  = コミットした / 9 = 差分なし / それ以外 = 失敗
          apply_and_commit() {
            # Jekyll ビルドを止める。これが無いと (a) `_` で始まるファイルが成果物から落ち、
            # (b) HTML本文の Liquid 構文（{{ や {%）でビルドごと失敗してサイトが更新されない。
            # ホストするのはAIが生成した任意のHTMLで、中身を事前に保証できない。
            [ -f "$work/.nojekyll" ] || : > "$work/.nojekyll"
            rm -rf "$work/pr-${number}"
            mkdir -p "$work/pr-${number}"
            cp -R "$out/." "$work/pr-${number}/"
            git -C "$work" add -A
            if git -C "$work" diff --cached --quiet; then
              return 9
            fi
            git -C "$work" commit -m "chore: publish report site for PR #${number} (${GITHUB_SHA})"
          }

          # 明示サブシェルで呼ぶ。`if apply_and_commit; then` のように条件式へ直接置くと、
          # 関数の内部でも `set -e` が一時停止し、cp 等が失敗しても先へ進んでしまう
          # （.claude/rules/shell-script-style.md「エラー方針」）。
          status=0
          ( apply_and_commit ) || status=$?
          case "$status" in
            0) ;;
            9) echo '変更がないため反映をスキップします'; exit 0 ;;
            *) echo "成果物の配置に失敗しました（終了コード ${status}）" >&2; exit 1 ;;
          esac

          # concurrency はPR単位なので、別PRとの書き込みは並走しうる。3回までリトライする。
          for attempt in 1 2 3; do
            if git -C "$work" push origin gh-pages; then
              echo "反映しました（${attempt} 回目）"
              exit 0
            fi
            echo "反映に失敗しました（${attempt} 回目）。リモートの状態へ合わせ直して再試行します"
            # **`git pull --rebase` は使えない。** gh-pages を orphan として作った直後に
            # 別の実行が先に同じことをしていると、履歴が繋がっていないため
            # `refusing to merge unrelated histories` で必ず失敗し、リトライが1回も機能しない。
            # マージせずリモートの現状へ合わせ直し、その上へ pr-<n>/ を置き直す
            # （他PRのディレクトリはリモート側の内容がそのまま残る）。
            git -C "$work" fetch origin gh-pages
            git -C "$work" reset --hard FETCH_HEAD
            status=0
            ( apply_and_commit ) || status=$?
            case "$status" in
              0) ;;
              9) echo '取り込み直したところ差分が無くなりました（他の実行が同じ内容を反映済み）'; exit 0 ;;
              *) echo "成果物の再配置に失敗しました（終了コード ${status}）" >&2; exit 1 ;;
            esac
          done
          echo '3回試しても反映できませんでした' >&2
          exit 1
