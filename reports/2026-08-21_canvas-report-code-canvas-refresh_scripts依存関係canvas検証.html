  .claude/hooks・.claude/scripts の実際のsource/呼び出し/データアクセス関係を
  .claude/skills/canvas-report/SKILL.md「依存関係の抽出手順」に従って抽出したもの。
  正文（検証結果の記録）は同名の .md を参照。

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>調査結果canvas</title>
<style>
  /* ==================== 基本 ==================== */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #020617; color: #e2e8f0;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
    font-size: 14px;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: #7dd3fc; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ==================== ヘッダー ==================== */
  #hdr {
    position: fixed; top: 0; left: 0; right: 0; z-index: 60; height: 56px;
    display: flex; align-items: center; gap: 16px; padding: 0 16px;
    background: rgba(2,6,23,.88); backdrop-filter: blur(6px);
    border-bottom: 1px solid #1e293b;
  }
  #hdr .ttl { min-width: 0; }
  #hdr .sub { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #64748b;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hdr h1 { margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; }
  #hdr .hint { margin-left: auto; font-size: 11px; color: #64748b; white-space: nowrap; }
  #zoom-ind {
    font-size: 11px; color: #94a3b8; background: #0f172a; border: 1px solid #1e293b;
    border-radius: 8px; padding: 4px 10px; white-space: nowrap;
  }

  /* 検索 */
  #search-wrap { position: relative; }
  #search {
    width: 280px; padding: 6px 10px; border-radius: 8px; border: 1px solid #334155;
    background: #0f172a; color: #e2e8f0; font-size: 12px; outline: none;
  }
  #search:focus { border-color: #7dd3fc; }
  #search-results {
    display: none; position: absolute; top: 34px; left: 0; width: 380px; max-height: 320px;
    overflow-y: auto; background: #0f172a; border: 1px solid #334155; border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,.5); z-index: 70;
  }
  #search-results.open { display: block; }
  .sr-item { padding: 7px 10px; cursor: pointer; border-bottom: 1px solid #1e293b; }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover, .sr-item.active { background: #1e293b; }
  .sr-item .sr-label { font-size: 12px; }
  .sr-item .sr-path { font-size: 10px; color: #64748b; font-family: ui-monospace, monospace; }
  .sr-kind { display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 4px;
             background: #1e293b; color: #94a3b8; margin-right: 6px; vertical-align: 1px; }

  /* ==================== キャンバス ==================== */
  #viewport {
    position: absolute; inset: 56px 0 0 0; overflow: hidden; cursor: grab;
    background-image: radial-gradient(circle, rgba(148,163,184,.28) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #edges path.hit { pointer-events: stroke; cursor: pointer; }
  #layers-bg, #nodes { position: absolute; left: 0; top: 0; }

  /* レイヤ帯 */
  .layer-band {
    position: absolute; border: 1.5px dashed; border-radius: 28px;
  }
  .layer-band .lb-label {
    position: absolute; top: 10px; left: 26px; font-weight: 700; letter-spacing: .06em;
    font-size: 17px; transition: font-size .2s;
  }
  .layer-band .lb-desc { position: absolute; top: 38px; left: 27px; font-size: 11px; color: #64748b; }
  :root[data-lod="0"] .layer-band .lb-label { font-size: 34px; }
  :root[data-lod="0"] .layer-band .lb-desc { font-size: 18px; top: 58px; }

  /* ==================== クラスノード ==================== */
  .cls {
    position: absolute; border: 1px solid #334155; border-radius: 12px;
    background: rgba(15,23,42,.96); box-shadow: 0 6px 18px rgba(0,0,0,.35);
    transition: box-shadow .15s, border-color .15s, opacity .2s;
  }
  .cls:hover { border-color: #64748b; }
  .cls.selected { border-color: #e879f9; box-shadow: 0 0 0 2px rgba(232,121,249,.5), 0 6px 18px rgba(0,0,0,.35); }
  .cls.rel-up { border-color: #fbbf24; }
  .cls.rel-down { border-color: #22d3ee; }
  .cls.expanded { z-index: 40; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  .cls.pulse { animation: pulse 1.2s ease-out 2; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(125,211,252,.7); }
    100% { box-shadow: 0 0 0 22px rgba(125,211,252,0); }
  }

  .cls .c-head { display: flex; align-items: flex-start; gap: 8px; padding: 9px 10px 7px; cursor: pointer; }
  .cls .c-stripe { width: 4px; align-self: stretch; border-radius: 3px; background: #334155; flex: none; }
  .cls .c-titles { min-width: 0; flex: 1; }
  .cls .c-name { font-size: 13.5px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
  .cls .c-path { font-size: 9.5px; color: #64748b; font-family: ui-monospace, monospace;
                 overflow-wrap: anywhere; margin-top: 2px; }
  .cls .c-desc { font-size: 10.5px; color: #94a3b8; margin-top: 3px; line-height: 1.4; }
  .cls .c-toggle {
    flex: none; width: 22px; height: 22px; border-radius: 6px; border: 1px solid #334155;
    background: #1e293b; font-size: 10px; line-height: 1; padding: 0;
  }
  .cls .c-toggle:hover { background: #334155; }

  /* 変更バッジ */
  .badge { display: inline-flex; gap: 4px; font-size: 9.5px; font-family: ui-monospace, monospace;
           border-radius: 5px; padding: 1px 5px; background: rgba(30,41,59,.9); vertical-align: 1px; }
  .badge .b-add { color: #34d399; }
  .badge .b-del { color: #fb7185; }
  .st-added   > .c-head .c-stripe, .m-row.st-added   .m-stripe { background: #34d399; }
  .st-modified> .c-head .c-stripe, .m-row.st-modified .m-stripe { background: #fbbf24; }
  .st-deleted > .c-head .c-stripe, .m-row.st-deleted  .m-stripe { background: #fb7185; }
  .st-deleted > .c-head .c-name, .m-row.st-deleted .m-sig { text-decoration: line-through; color: #94a3b8; }

  /* メンバ行 */
  .cls .c-members { border-top: 1px solid #1e293b; padding: 4px 0 6px; }
  .m-row { display: flex; align-items: baseline; gap: 6px; padding: 3px 10px 3px 8px; }
  .m-row .m-stripe { flex: none; width: 3px; height: 10px; border-radius: 2px; background: #334155;
                     align-self: center; }
  .m-row .m-sig { font-size: 11px; font-family: ui-monospace, monospace; overflow-wrap: anywhere;
                  min-width: 0; flex: 1; cursor: pointer; }
  .m-row .m-sig:hover { color: #7dd3fc; }
  .m-row.m-selected .m-sig { color: #e879f9; font-weight: 700; }
  .m-row .m-lines { font-size: 9px; color: #475569; font-family: ui-monospace, monospace; white-space: nowrap; }

  /* コード片（L2でのみ表示） */
  .m-block { border-bottom: 1px solid rgba(30,41,59,.6); }
  .m-block:last-child { border-bottom: none; }
  .m-code { display: none; margin: 2px 10px 8px 17px; border: 1px solid #1e293b; border-radius: 8px;
            background: #0b1120; overflow: hidden; }
  .m-code .mc-src { font-size: 9px; color: #64748b; font-family: ui-monospace, monospace;
                    padding: 4px 8px; border-bottom: 1px solid #1e293b; background: rgba(30,41,59,.5);
                    overflow-wrap: anywhere; }
  .m-code .mc-lines { padding: 5px 0; overflow-x: auto; }
  .m-code .mc-line { display: flex; white-space: pre; font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
                     font-size: 10px; line-height: 1.55; }
  .m-code .ln { flex: none; width: 40px; text-align: right; padding-right: 10px; color: #475569;
                user-select: none; }
  .m-code .lc { color: #cbd5e1; padding-right: 10px; }

  /* LOD段階の表示切替（クラス単位。data-level=0/1/2） */
  .cls[data-level="0"] .c-members, .cls[data-level="0"] .c-path, .cls[data-level="0"] .c-desc { display: none; }
  .cls[data-level="0"] .c-name { font-size: 19px; }
  .cls[data-level="0"] .c-mcount { display: inline; }
  .c-mcount { display: none; font-size: 11px; color: #64748b; font-weight: 400; margin-left: 6px; }
  .cls[data-level="2"] .m-code { display: block; }

  /* ==================== 左パネル（凡例・トグル） ==================== */
  #panel {
    position: fixed; left: 12px; bottom: 12px; z-index: 55; width: 232px;
    background: rgba(15,23,42,.94); border: 1px solid #1e293b; border-radius: 12px;
    font-size: 11px; backdrop-filter: blur(6px); max-height: calc(100% - 90px);
    overflow-y: auto;
  }
  #panel details { border-bottom: 1px solid #1e293b; }
  #panel details:last-child { border-bottom: none; }
  #panel summary { padding: 8px 12px; font-weight: 700; color: #cbd5e1; cursor: pointer;
                   list-style: none; user-select: none; }
  #panel summary::before { content: "▸ "; color: #64748b; }
  #panel details[open] summary::before { content: "▾ "; }
  #panel .pbody { padding: 2px 12px 10px; }
  #panel label { display: flex; align-items: center; gap: 7px; padding: 2.5px 0; cursor: pointer;
                 color: #94a3b8; }
  #panel label:hover { color: #e2e8f0; }
  .sw { flex: none; width: 12px; height: 12px; border-radius: 4px; }
  .sw-line { flex: none; width: 18px; border-top-width: 2.5px; border-top-style: solid; }
  .legend-row { display: flex; align-items: center; gap: 7px; padding: 2.5px 0; color: #94a3b8; }

  /* ==================== ミニマップ ==================== */
  #minimap-wrap { position: fixed; top: 68px; right: 12px; z-index: 55; }
  #minimap {
    position: relative; width: 220px; height: 140px; overflow: hidden; cursor: pointer;
    border: 1px solid #334155; border-radius: 10px; background: rgba(15,23,42,.92);
    backdrop-filter: blur(6px);
  }
  #minimap .mm-node { position: absolute; border-radius: 2px; }
  #minimap-view { position: absolute; border: 1.5px solid rgba(232,121,249,.85);
                  background: rgba(232,121,249,.12); pointer-events: none; }
  #minimap-wrap p { margin: 3px 2px 0 0; font-size: 9px; color: #64748b; text-align: right; }

  /* ==================== ズームボタン ==================== */
  #zoom-btns { position: fixed; right: 12px; bottom: 12px; z-index: 55; display: flex;
               flex-direction: column; gap: 6px; }
  #zoom-btns button {
    width: 38px; height: 34px; border-radius: 9px; background: #0f172a; border: 1px solid #334155;
    font-size: 15px;
  }
  #zoom-btns button:hover { background: #1e293b; }
  #zoom-btns #btn-fit { font-size: 10px; letter-spacing: .05em; }

  /* ==================== エッジツールチップ ==================== */
  #edge-tip {
    display: none; position: fixed; z-index: 80; pointer-events: none; max-width: 380px;
    background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 7px 10px;
    font-size: 11px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  #edge-tip .et-kind { font-weight: 700; }
  #edge-tip .et-route { color: #94a3b8; font-family: ui-monospace, monospace; font-size: 10px;
                        margin-top: 2px; overflow-wrap: anywhere; }
  #edge-tip .et-label { color: #cbd5e1; margin-top: 2px; }

  /* ==================== 詳細パネル ==================== */
  #detail-backdrop { position: fixed; inset: 0; z-index: 62; background: rgba(0,0,0,.45);
                     opacity: 0; pointer-events: none; transition: opacity .25s; }
  #detail-backdrop.open { opacity: 1; pointer-events: auto; }
  #detail {
    position: fixed; top: 0; right: 0; z-index: 63; height: 100%; width: min(460px, 100%);
    background: #0f172a; border-left: 1px solid #334155; box-shadow: -12px 0 40px rgba(0,0,0,.5);
    transform: translateX(100%); transition: transform .25s; overflow-y: auto;
  }
  #detail.open { transform: translateX(0); }
  #detail .d-head { position: sticky; top: 0; display: flex; align-items: flex-start; gap: 10px;
                    padding: 14px 16px; background: rgba(15,23,42,.97); border-bottom: 1px solid #1e293b; }
  #detail .d-head h2 { margin: 2px 0 0; font-size: 16px; flex: 1; overflow-wrap: anywhere; }
  #detail .d-sub { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #64748b; }
  #detail-close { flex: none; width: 30px; height: 30px; border-radius: 8px; background: #1e293b;
                  border: 1px solid #334155; }
  #detail .d-body { padding: 14px 16px 24px; font-size: 12.5px; line-height: 1.7; color: #cbd5e1; }
  #detail .d-path { font-family: ui-monospace, monospace; font-size: 11px; overflow-wrap: anywhere; }
  #detail .d-text { white-space: pre-wrap; margin-top: 10px; }
  #detail .d-mermaid { margin-top: 12px; border: 1px solid #1e293b; border-radius: 10px;
                       background: #0b1120; padding: 10px; overflow-x: auto; }
  #detail .d-mermaid pre { margin: 0; font-size: 10px; color: #94a3b8; white-space: pre-wrap; }
  #detail .d-note { font-size: 10px; color: #64748b; margin-top: 4px; }

  /* ==================== データエラーパネル ==================== */
  #data-errors {
    display: none; position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
    z-index: 90; max-width: min(720px, calc(100% - 40px)); max-height: 40%; overflow-y: auto;
    background: rgba(69,10,10,.96); border: 1.5px solid #ef4444; border-radius: 12px;
    padding: 10px 16px; box-shadow: 0 12px 40px rgba(0,0,0,.6);
  }
  #data-errors.open { display: block; }
  #data-errors h3 { margin: 0 0 6px; font-size: 12px; color: #fecaca; }
  #data-errors li { color: #fca5a5; font-size: 11.5px; line-height: 1.6; }

  /* エッジの破線を流すアニメーション（選択時のフロー表示） */
  @keyframes edgeflow { to { stroke-dashoffset: -26; } }
  #edges path.flow { stroke-dasharray: 8 5; animation: edgeflow 1.1s linear infinite; }
</style>
</head>
<body>

  <header id="hdr">
    <div class="ttl">
      <p class="sub" id="hdr-sub"></p>
      <h1 id="hdr-title"></h1>
    </div>
    <div id="search-wrap">

      <div id="search-results"></div>
    </div>
    <span id="zoom-ind">100% ・ L1</span>
    <p class="hint">ドラッグ=パン ・ ホイール=ズーム（Ctrl+ホイール=微調整） ・ クリック=選択 ・ f=フィット ・ Esc=解除</p>

      <div id="layers-bg"></div>
      <svg id="edges"><defs id="edge-defs"></defs><g id="edge-g"></g></svg>

  <div id="minimap-wrap">

    <button id="btn-zout" title="ズームアウト">－</button>

  <aside id="panel"></aside>

  <div id="edge-tip"></div>

  <div id="data-errors"><h3>⚠ データ定義エラー（該当要素は描画をスキップ）</h3><ul id="data-errors-list"></ul></div>

    if (parentOk.has(id)) continue;               // メンバは後段
    if (n.parent !== undefined && n.parent !== null) continue;  // 不正なメンバはスキップ済み
    if (!n.layer) { errors.push(`クラス "${id}": 必須項目 layer がありません（描画をスキップ）`); continue; }
    const layer = model.layerById.get(n.layer);
    if (!layer) { errors.push(`クラス "${id}": 未定義のレイヤ "${n.layer}" を参照しています（描画をスキップ）`); continue; }
    const cls = { kind: 'class', id, raw: n, layer, members: [],
                  label: n.label || id, x: 0, y: 0, w: CLASS_W, el: null };
    model.classes.push(cls);
    model.byId.set(id, cls);
    layer.classes.push(cls);
  }

  // メンバの組み立て
  for (const [id, clsId] of parentOk) {
    const n = rawById.get(id);
    const cls = model.byId.get(clsId);
    if (!cls || cls.kind !== 'class') {
      errors.push(`メンバ "${id}": parent "${clsId}" がクラスとして描画されないためスキップします`);
      continue;
    }
    const mem = { kind: 'member', id, raw: n, cls, label: n.label || id, el: null };
    cls.members.push(mem);
    model.byId.set(id, mem);
  }

  // エッジの検証（未定義ID参照・未知のkind）
  edges.forEach((e, i) => {
    if (!e || !e.from || !e.to) { errors.push(`edges[${i}]: 必須項目 from / to がありません`); return; }
    const src = model.byId.get(e.from), dst = model.byId.get(e.to);
    if (!src) { errors.push(`edges[${i}] (${e.from} → ${e.to}): 未定義のID "${e.from}" を参照しています`); return; }
    if (!dst) { errors.push(`edges[${i}] (${e.from} → ${e.to}): 未定義のID "${e.to}" を参照しています`); return; }
    let kind = e.kind;
    if (!kind || !EDGE_KINDS[kind]) {
      errors.push(`edges[${i}] (${e.from} → ${e.to}): 未知の関係種別 "${e.kind}" です（other として描画）`);
      kind = 'other';
      if (!EDGE_KINDS.other) return;
    }
    model.edges.push({
      id: 'e' + i, raw: e, kind,
      srcCls: src.kind === 'class' ? src : src.cls, srcMem: src.kind === 'member' ? src : null,
      dstCls: dst.kind === 'class' ? dst : dst.cls, dstMem: dst.kind === 'member' ? dst : null,
    });
  });
}

function renderErrors() {
  const box = $('data-errors'), list = $('data-errors-list');
  list.textContent = '';
  if (errors.length === 0) { box.classList.remove('open'); return; }
  errors.forEach(msg => list.appendChild(el('li', '', msg)));
  box.classList.add('open');
}

// ---------- レイアウト ----------
// レイヤ帯を縦に積み、帯内はbarycenter法で列順を決めて行折返しの格子配置にする。
// footprintはメンバ一覧表示時（L1）の高さで確保する（L2のコード片・展開は重なりを許容し、
// 最前面＋減光で読みやすさを保つ。issue #141の除外事項「展開時の周囲再レイアウト」）。
let worldW = 0, worldH = 0;

function estimateL1Height(cls) {
  // ヘッダ（名前・パス・説明）＋メンバ行の概算高さ。長いラベルの折り返しを反映できないため、
  // DOM生成後に measureHeights() で実測し、実測値で layout() をやり直す（下記boot手順）
  const headH = 34 + (cls.raw.path ? 15 : 0) + (cls.raw.desc ? 18 : 0);
  const memH = cls.members.length > 0 ? 12 + cls.members.length * 22 : 0;
  return headH + memH + 8;
}

// レイアウトに使う高さ。実測済み（measureHeights後）ならoffsetHeightの実測値を優先する
function heightForLayout(cls) {
  return cls.measH || estimateL1Height(cls);
}

// L1（メンバ一覧表示）状態でのクラス箱の実高さを一括測定する。
// renderClasses直後（globalLOD=1・override無し）に呼ぶこと
function measureHeights() {
  for (const cls of model.classes) {
    if (cls.el) cls.measH = cls.el.offsetHeight;
  }
}

// layout()の再計算結果を生成済みDOM（帯・クラス箱の位置とサイズ）へ反映する
function syncLayoutDom() {
  for (const layer of model.layers) {
    if (!layer.el) continue;
    layer.el.style.left = layer.x + 'px';
    layer.el.style.top = layer.y + 'px';
    layer.el.style.width = layer.w + 'px';
    layer.el.style.height = layer.h + 'px';
  }
  for (const cls of model.classes) {
    if (!cls.el) continue;
    cls.el.style.left = cls.x + 'px';
    cls.el.style.top = cls.y + 'px';
  }
}

function orderByBarycenter() {
  // クラスペア単位の接続表
  const adj = new Map();  // clsId → Set(clsId)
  model.classes.forEach(c => adj.set(c.id, new Set()));
  model.edges.forEach(e => {
    if (e.srcCls.id !== e.dstCls.id) {
      adj.get(e.srcCls.id).add(e.dstCls.id);
      adj.get(e.dstCls.id).add(e.srcCls.id);
    }
  });
  const pos = new Map();  // clsId → 帯内の並び位置
  const setPos = (layer) => layer.classes.forEach((c, i) => pos.set(c.id, i));
  model.layers.forEach(setPos);
  // 上→下、下→上の2パスで隣接レイヤの平均位置に寄せる
  for (const dir of [1, -1]) {
    const seq = dir === 1 ? model.layers : [...model.layers].reverse();
    for (let li = 1; li < seq.length; li++) {
      const layer = seq[li];
      layer.classes.sort((a, b) => bary(a) - bary(b));
      setPos(layer);
    }
  }
  function bary(c) {
    const ns = [...adj.get(c.id)].map(id => pos.get(id)).filter(v => v !== undefined);
    if (ns.length === 0) return pos.get(c.id);
    return ns.reduce((s, v) => s + v, 0) / ns.length;
  }
}

function layout() {
  orderByBarycenter();
  let y = WORLD_PAD;
  let maxRight = 0;
  for (const layer of model.layers) {
    layer.x = WORLD_PAD; layer.y = y;
    let cx = 0, cy = 0, rowMaxH = 0, bandW = 0;
    for (const cls of layer.classes) {
      const h = heightForLayout(cls);
      if (cx > 0 && cx + CLASS_W > WRAP_W) {         // 行の折返し
        cx = 0; cy += rowMaxH + GAP_Y; rowMaxH = 0;
      }
      cls.x = layer.x + BAND_PAD_X + cx;
      cls.y = layer.y + BAND_PAD_TOP + cy;
      cls.estH = h;
      rowMaxH = Math.max(rowMaxH, h);
      bandW = Math.max(bandW, cx + CLASS_W);
      cx += CLASS_W + GAP_X;
    }
    layer.w = Math.max(bandW + BAND_PAD_X * 2, 460);
    layer.h = BAND_PAD_TOP + cy + rowMaxH + BAND_PAD_BOTTOM;
    if (layer.classes.length === 0) layer.h = BAND_PAD_TOP + 20;
    maxRight = Math.max(maxRight, layer.x + layer.w);
    y += layer.h + BAND_GAP;
  }
  // 明示された座標があれば上書き（通常は書かない。微調整用）
  for (const cls of model.classes) {
    if (typeof cls.raw.x === 'number') cls.x = cls.raw.x;
    if (typeof cls.raw.y === 'number') cls.y = cls.raw.y;
    maxRight = Math.max(maxRight, cls.x + CLASS_W + WORLD_PAD);
    y = Math.max(y, cls.y + cls.estH + BAND_GAP);
  }
  worldW = maxRight + WORLD_PAD;
  worldH = y - BAND_GAP + WORLD_PAD;
  world.style.width = worldW + 'px';
  world.style.height = worldH + 'px';
  svg.setAttribute('width', worldW);
  svg.setAttribute('height', worldH);
}

// ---------- ノード描画 ----------
function changeBadge(change) {
  if (!change) return null;
  const b = el('span', 'badge');
  if (typeof change.add === 'number' && change.add > 0) b.appendChild(el('span', 'b-add', '+' + change.add));
  if (typeof change.del === 'number' && change.del > 0) b.appendChild(el('span', 'b-del', '−' + change.del));
  if (!b.hasChildNodes()) {
    const t = { added: '追加', modified: '変更', deleted: '削除' }[change.status];
    if (t) b.appendChild(el('span', change.status === 'deleted' ? 'b-del' : 'b-add', t));
  }
  return b.hasChildNodes() ? b : null;
}

function sourceRef(path, lines) {
  // 出所表示（path:lines）。meta.repoUrlがあればリンク化する
  const text = lines ? `${path}:${lines}` : path;
  const repo = (CANVAS_DATA.meta && CANVAS_DATA.meta.repoUrl) || '';
  if (repo && path) {
    const a = document.createElement('a');
    const m = lines ? String(lines).match(/^(\d+)(?:-(\d+))?/) : null;
    const frag = m ? ('#L' + m[1] + (m[2] ? '-L' + m[2] : '')) : '';
    a.href = repo.replace(/\/+$/, '/') + path.replace(/^\/+/, '') + frag;
    a.target = '_blank'; a.rel = 'noopener';
    a.textContent = text;
    return a;
  }
  return document.createTextNode(text);
}

function renderLayers() {
  for (const layer of model.layers) {
    const band = el('div', 'layer-band');
    band.style.left = layer.x + 'px';
    band.style.top = layer.y + 'px';
    band.style.width = layer.w + 'px';
    band.style.height = layer.h + 'px';
    band.style.borderColor = layer.palette.border;
    band.style.background = layer.palette.bg;
    const lb = el('div', 'lb-label', layer.label);
    lb.style.color = layer.palette.text;
    band.appendChild(lb);
    if (layer.desc) band.appendChild(el('div', 'lb-desc', layer.desc));
    layer.el = band;
    layersBg.appendChild(band);
  }
}

function renderClasses() {
  for (const cls of model.classes) {
    const box = el('div', 'cls');
    box.dataset.cls = cls.id;
    if (cls.raw.change) box.classList.add('st-' + cls.raw.change.status);
    box.style.left = cls.x + 'px';
    box.style.top = cls.y + 'px';
    box.style.width = CLASS_W + 'px';

    const head = el('div', 'c-head');
    head.dataset.act = 'class-select';
    head.appendChild(el('div', 'c-stripe'));
    const titles = el('div', 'c-titles');
    const name = el('div', 'c-name', cls.label);
    const mcount = el('span', 'c-mcount', cls.members.length > 0 ? `(${cls.members.length})` : '');
    name.appendChild(mcount);
    const badge = changeBadge(cls.raw.change);
    if (badge) { name.appendChild(document.createTextNode(' ')); name.appendChild(badge); }
    titles.appendChild(name);
    if (cls.raw.path) {
      const p = el('div', 'c-path');
      p.appendChild(sourceRef(cls.raw.path, cls.raw.lines));
      titles.appendChild(p);
    }
    if (cls.raw.desc) titles.appendChild(el('div', 'c-desc', cls.raw.desc));
    head.appendChild(titles);
    if (cls.members.length > 0) {
      const tg = el('button', 'c-toggle', '▾');
      tg.title = '折りたたみ / 展開';
      tg.dataset.act = 'class-toggle';
      head.appendChild(tg);
    }
    box.appendChild(head);

    if (cls.members.length > 0) {
      const list = el('div', 'c-members');
      for (const mem of cls.members) {
        const block = el('div', 'm-block');
        const row = el('div', 'm-row');
        row.dataset.mem = mem.id;
        if (mem.raw.change) row.classList.add('st-' + mem.raw.change.status);
        row.appendChild(el('span', 'm-stripe'));
        const sig = el('span', 'm-sig', mem.label);
        sig.dataset.act = 'member-select';
        const mb = changeBadge(mem.raw.change);
        if (mb) { sig.appendChild(document.createTextNode(' ')); sig.appendChild(mb); }
        row.appendChild(sig);
        if (mem.raw.lines) row.appendChild(el('span', 'm-lines', ':' + mem.raw.lines));
        block.appendChild(row);
        if (mem.raw.code) {
          const codeBox = el('div', 'm-code');
          const src = el('div', 'mc-src');
          src.appendChild(sourceRef(mem.raw.path || cls.raw.path || '', mem.raw.lines));
          codeBox.appendChild(src);
          const linesBox = el('div', 'mc-lines');
          let ln = typeof mem.raw.codeStart === 'number' ? mem.raw.codeStart
                 : (mem.raw.lines && /^\d+/.test(mem.raw.lines) ? parseInt(mem.raw.lines, 10) : 1);
          for (const lineText of String(mem.raw.code).split('\n')) {
            const line = el('div', 'mc-line');
            line.appendChild(el('span', 'ln', String(ln++)));
            line.appendChild(el('span', 'lc', lineText));
            linesBox.appendChild(line);
          }
          codeBox.appendChild(linesBox);
          block.appendChild(codeBox);
        }
        list.appendChild(block);
        mem.el = row;
      }
      box.appendChild(list);
    }
    cls.el = box;
    nodesLayer.appendChild(box);
  }
  applyLevels();
}

// ---------- LOD（セマンティックズーム）と折りたたみ ----------
function lodForScale(s) { return s < LOD_L1 ? 0 : (s < LOD_L2 ? 1 : 2); }
function effLevel(cls) {
  const ov = overrides.get(cls.id);
  return ov !== undefined ? ov : globalLOD;
}
function applyLevels() {
  document.documentElement.dataset.lod = String(globalLOD);
  let hasExpanded = false;
  for (const cls of model.classes) {
    const lv = effLevel(cls);
    cls.el.dataset.level = String(lv);
    const expanded = overrides.get(cls.id) === 2;
    cls.el.classList.toggle('expanded', expanded);
    if (expanded) hasExpanded = true;
    const tg = cls.el.querySelector('.c-toggle');
    if (tg) tg.textContent = lv === 0 ? '▸' : '▾';
  }
  document.documentElement.dataset.hasExpanded = hasExpanded ? '1' : '0';
  updateEmphasis();
}
function toggleClass(cls) {
  // 現在の見た目に対して直感的に反転させる（▾→折りたたみ、▸→展開）。Escで全て解除
  if (effLevel(cls) >= 1) overrides.set(cls.id, 0);
  else overrides.set(cls.id, 2);
  applyLevels();
  redrawEdges();
}

// ---------- エッジ描画 ----------
// クラスの表示状態に応じて端点を決める:
//   メンバ単位のエッジは、そのクラスがメンバ行を表示中（level>=1）ならメンバ行を端点にする。
//   両端ともクラス箱が端点になるエッジは（クラスペア, kind）単位で1本へ集約し、太さ＝本数。
const markerCache = new Map();
function markerFor(color) {
  if (markerCache.has(color)) return markerCache.get(color);
  const id = 'arw-' + markerCache.size;
  const m = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
  m.setAttribute('id', id);
  m.setAttribute('viewBox', '0 0 10 10');
  m.setAttribute('refX', '9'); m.setAttribute('refY', '5');
  m.setAttribute('markerWidth', '11'); m.setAttribute('markerHeight', '11');
  m.setAttribute('markerUnits', 'userSpaceOnUse');
  m.setAttribute('orient', 'auto-start-reverse');
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', 'M0,0 L10,5 L0,10 z');
  p.setAttribute('fill', color);
  m.appendChild(p);
  edgeDefs.appendChild(m);
  markerCache.set(color, id);
  return id;
}

function clsVisible(cls) { return layerVisible.get(cls.layer.id) !== false; }
function boxH(cls) { return cls.el ? cls.el.offsetHeight : cls.estH; }

// 端点情報: メンバ行が見えていれば行のY、そうでなければクラス箱
function anchorInfo(cls, mem) {
  const useMem = mem && effLevel(cls) >= 1;
  if (useMem && mem.el) {
    return { cls, mem, x: cls.x, w: CLASS_W,
             y: cls.y + mem.el.offsetTop + mem.el.offsetHeight / 2, kind: 'row' };
  }
  return { cls, mem: null, x: cls.x, w: CLASS_W, y: cls.y + boxH(cls) / 2, kind: 'box' };
}

let drawnEdges = [];
function redrawEdges() {
  edgeG.textContent = '';
  drawnEdges = [];

  // 1. 可視エッジを端点解決し、集約グループへ振り分ける
  const groups = new Map();  // key → { edges, srcA, dstA }
  for (const e of model.edges) {
    if (kindVisible.get(e.kind) === false) continue;
    if (!clsVisible(e.srcCls) || !clsVisible(e.dstCls)) continue;
    const srcA = anchorInfo(e.srcCls, e.srcMem);
    const dstA = anchorInfo(e.dstCls, e.dstMem);
    const aggregate = srcA.kind === 'box' && dstA.kind === 'box';
    const key = aggregate
      ? `agg|${e.srcCls.id}|${e.dstCls.id}|${e.kind}`
      : `one|${e.id}`;
    if (!groups.has(key)) groups.set(key, { edges: [], srcA, dstA, kind: e.kind, aggregate });
    groups.get(key).edges.push(e);
  }

  // 2. 同一クラスペア間の平行エッジを分離するためのオフセット割当（無向ペア単位）
  const pairCount = new Map(), pairIndex = new Map();
  for (const [key, g] of groups) {
    const pk = [g.srcA.cls.id, g.dstA.cls.id].sort().join('|');
    pairCount.set(pk, (pairCount.get(pk) || 0) + 1);
    pairIndex.set(key, pairCount.get(pk) - 1);
  }

  // 3. 描画
  for (const [key, g] of groups) {
    const style = EDGE_KINDS[g.kind] || EDGE_KINDS.other || { color: '#64748b', width: 1.5 };
    const pk = [g.srcA.cls.id, g.dstA.cls.id].sort().join('|');
    const n = pairCount.get(pk), idx = pairIndex.get(key);
    const off = (idx - (n - 1) / 2) * 16;
    const d = edgePathD(g.srcA, g.dstA, off);
    const count = g.edges.length;
    const width = g.aggregate && count > 1 ? clamp(style.width + count * 0.8, 2, 6.5) : style.width;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', style.color);
    path.setAttribute('stroke-width', width);
    if (style.dash) path.setAttribute('stroke-dasharray', style.dash);
    path.setAttribute('marker-end', `url(#${markerFor(style.color)})`);
    path.setAttribute('opacity', '0.75');

    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    hit.setAttribute('d', d);
    hit.setAttribute('fill', 'none');
    hit.setAttribute('stroke', 'rgba(0,0,0,0)');
    hit.setAttribute('stroke-width', '14');
    hit.setAttribute('class', 'hit');

    edgeG.appendChild(path);
    edgeG.appendChild(hit);
    const de = { path, hit, group: g, baseColor: style.color, baseWidth: width, baseDash: style.dash };
    drawnEdges.push(de);
    hit.addEventListener('pointerenter', (ev) => showEdgeTip(de, ev));
    hit.addEventListener('pointermove', (ev) => moveEdgeTip(ev));
    hit.addEventListener('pointerleave', hideEdgeTip);
  }
  styleEdges();
}

function edgePathD(a, b, off) {
  // 自己ループ（同一クラス内）: 右側へ弧を描く
  if (a.cls === b.cls) {
    const x = a.x + a.w, y1 = a.y, y2 = (a.mem || b.mem) && Math.abs(b.y - a.y) > 1 ? b.y : a.y + 26;
    const r = 60 + Math.abs(off);
    return `M ${x},${y1} C ${x + r},${y1 - 14} ${x + r},${y2 + 14} ${x},${y2}`;
  }
  const acx = a.x + a.w / 2, bcx = b.x + b.w / 2;
  const dx = bcx - acx;
  const dyC = (b.cls.y + boxH(b.cls) / 2) - (a.cls.y + boxH(a.cls) / 2);
  let x1, y1, x2, y2, c1x, c1y, c2x, c2y;
  const horiz = a.kind === 'row' || b.kind === 'row' || Math.abs(dx) > Math.abs(dyC);
  if (horiz) {
    // 左右の辺から出入りする（メンバ行の端点は常に左右）。
    // X範囲が重なる縦並びのクラス間は、交差を避けるため同じ側（左）から出入りする
    let s1 = dx >= 0 ? 1 : -1, s2 = -s1;
    if (Math.abs(dx) < CLASS_W * 0.9) { s1 = -1; s2 = -1; }
    x1 = a.x + (s1 > 0 ? a.w : 0); y1 = a.y + off * 0.35;
    x2 = b.x + (s2 > 0 ? b.w : 0); y2 = b.y + off * 0.35;
    const k = s1 === s2
      ? clamp(Math.abs(y2 - y1) * 0.3, 50, 130) + Math.abs(off)
      : clamp(Math.abs(x2 - x1) * 0.42, 46, 190);
    c1x = x1 + s1 * k; c1y = y1 + off;
    c2x = x2 + s2 * k; c2y = y2 + off;
  } else {
    // 上下の辺から出入りする（帯をまたぐクラス単位エッジの既定）
    const s1 = dyC >= 0 ? 1 : -1;
    x1 = acx + off; y1 = a.cls.y + (s1 > 0 ? boxH(a.cls) : 0);
    x2 = bcx + off; y2 = b.cls.y + (s1 > 0 ? 0 : boxH(b.cls));
    const k = clamp(Math.abs(y2 - y1) * 0.42, 46, 190);
    c1x = x1 + off * 0.4; c1y = y1 + s1 * k;
    c2x = x2 + off * 0.4; c2y = y2 - s1 * k;
  }
  return `M ${x1},${y1} C ${c1x},${c1y} ${c2x},${c2y} ${x2},${y2}`;
}

// ---------- 選択・ハイライト ----------
function selectionScope() {
  // 選択対象に属するノードidの集合（クラス選択ならメンバも含む）
  if (!selection) return null;
  const scope = new Set([selection.id]);
  const node = model.byId.get(selection.id);
  if (node && node.kind === 'class') node.members.forEach(m => scope.add(m.id));
  return scope;
}
function edgeEndIds(e, side) {
  return side === 'src' ? (e.srcMem ? e.srcMem.id : e.srcCls.id) : (e.dstMem ? e.dstMem.id : e.dstCls.id);
}

function styleEdges() {
  const scope = selectionScope();
  const hover = !scope && hoverClsId ? hoverClsId : null;
  for (const de of drawnEdges) {
    let color = de.baseColor, width = de.baseWidth, opacity = 0.75, flow = false, stroke = null;
    if (scope) {
      const up = de.group.edges.some(e => scope.has(edgeEndIds(e, 'dst')));
      const down = de.group.edges.some(e => scope.has(edgeEndIds(e, 'src')));
      if (up || down) {
        color = up && !down ? COL_UP : (down && !up ? COL_DOWN : '#e879f9');
        width = de.baseWidth + 0.8; opacity = 1; flow = true;
      } else { stroke = COL_DIM_EDGE; opacity = 1; }
    } else if (hover) {
      const rel = de.group.srcA.cls.id === hover || de.group.dstA.cls.id === hover;
      if (rel) { color = '#e879f9'; opacity = 1; width = de.baseWidth + 0.6; }
      else opacity = 0.28;
    }
    de.path.setAttribute('stroke', stroke || color);
    de.path.setAttribute('stroke-width', width);
    de.path.setAttribute('opacity', opacity);
    de.path.setAttribute('marker-end', `url(#${markerFor(stroke || color)})`);
    de.path.classList.toggle('flow', flow);
    if (flow) de.path.removeAttribute('stroke-dasharray');
    else if (de.baseDash) de.path.setAttribute('stroke-dasharray', de.baseDash);
    else de.path.removeAttribute('stroke-dasharray');
  }
}

function updateEmphasis() {
  const scope = selectionScope();
  const hasExpanded = document.documentElement.dataset.hasExpanded === '1';
  // 選択に関連するクラスと方向を求める
  const relUp = new Set(), relDown = new Set();
  if (scope) {
    for (const e of model.edges) {
      if (kindVisible.get(e.kind) === false) continue;
      if (scope.has(edgeEndIds(e, 'dst'))) relUp.add(e.srcCls.id);
      if (scope.has(edgeEndIds(e, 'src'))) relDown.add(e.dstCls.id);
    }
  }
  for (const cls of model.classes) {
    const box = cls.el;
    const isSel = selection && (selection.id === cls.id || (model.byId.get(selection.id) || {}).cls === cls);
    box.classList.toggle('selected', !!isSel);
    box.classList.toggle('rel-up', !isSel && relUp.has(cls.id));
    box.classList.toggle('rel-down', !isSel && relDown.has(cls.id));
    let op = 1;
    if (!clsVisible(cls)) op = 0;
    else if (scope) op = (isSel || relUp.has(cls.id) || relDown.has(cls.id)) ? 1 : 0.25;
    else if (hasExpanded) op = overrides.get(cls.id) === 2 ? 1 : 0.45;
    box.style.opacity = String(op);
    box.style.pointerEvents = clsVisible(cls) ? '' : 'none';
    box.style.display = clsVisible(cls) ? '' : 'none';
    for (const mem of cls.members) {
      mem.el.classList.toggle('m-selected', !!selection && selection.id === mem.id);
    }
  }
  for (const layer of model.layers) {
    layer.el.style.display = layerVisible.get(layer.id) === false ? 'none' : '';
  }
}

function setSelection(sel) {
  selection = sel;
  updateEmphasis();
  styleEdges();
}

// ---------- エッジツールチップ ----------
const edgeTip = $('edge-tip');
function showEdgeTip(de, ev) {
  edgeTip.textContent = '';
  const style = EDGE_KINDS[de.group.kind] || {};
  const kindEl = el('div', 'et-kind', (style.label || de.group.kind) +
    (de.group.aggregate && de.group.edges.length > 1 ? `（集約 ${de.group.edges.length}本）` : ''));
  kindEl.style.color = style.color || '#e2e8f0';
  edgeTip.appendChild(kindEl);
  for (const e of de.group.edges.slice(0, 6)) {
    const from = e.srcMem ? `${e.srcCls.label} / ${e.srcMem.label}` : e.srcCls.label;
    const to = e.dstMem ? `${e.dstCls.label} / ${e.dstMem.label}` : e.dstCls.label;
    edgeTip.appendChild(el('div', 'et-route', `${from} → ${to}`));
    if (e.raw.label) edgeTip.appendChild(el('div', 'et-label', e.raw.label));
  }
  if (de.group.edges.length > 6) edgeTip.appendChild(el('div', 'et-label', `…ほか${de.group.edges.length - 6}本`));
  edgeTip.style.display = 'block';
  moveEdgeTip(ev);
}
function moveEdgeTip(ev) {
  const pad = 14;
  const w = edgeTip.offsetWidth, h = edgeTip.offsetHeight;
  edgeTip.style.left = Math.min(ev.clientX + pad, window.innerWidth - w - 8) + 'px';
  edgeTip.style.top = Math.min(ev.clientY + pad, window.innerHeight - h - 8) + 'px';
}
function hideEdgeTip() { edgeTip.style.display = 'none'; }

// ---------- パン・ズーム ----------
function applyTransform() {
  world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  const lod = lodForScale(scale);
  if (lod !== globalLOD) {
    globalLOD = lod;
    applyLevels();
    redrawEdges();
  }
  $('zoom-ind').textContent = Math.round(scale * 100) + '% ・ ' +
    ['L0 レイヤ俯瞰', 'L1 クラス', 'L2 コード'][globalLOD];
  updateMinimapView();
}

function zoomAt(clientX, clientY, factor) {
  const rect = viewport.getBoundingClientRect();
  const mx = clientX - rect.left, my = clientY - rect.top;
  const prev = scale;
  scale = clamp(scale * factor, SCALE_MIN, SCALE_MAX);
  panX = mx - (mx - panX) * (scale / prev);
  panY = my - (my - panY) * (scale / prev);
  applyTransform();
}

viewport.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  if (ev.ctrlKey || ev.metaKey) {
    // トラックパッドのピンチはctrlKey付きwheelとして届く。指数でなめらかに
    zoomAt(ev.clientX, ev.clientY, Math.exp(-ev.deltaY * 0.01));
  } else if (ev.deltaMode === 0 && (Math.abs(ev.deltaY) < 40 || Math.abs(ev.deltaX) > 0)) {
    // 小刻みな連続デルタ＝トラックパッドの2本指スクロールとみなしてパン
    panX -= ev.deltaX; panY -= ev.deltaY;
    applyTransform();
  } else {
    // 段階の大きいデルタ＝マウスホイールとみなしてズーム
    zoomAt(ev.clientX, ev.clientY, ev.deltaY < 0 ? 1.16 : 1 / 1.16);
  }
}, { passive: false });

// パン: ノードの上からでも開始できる（移動閾値4pxでクリックと区別する）
let panState = null;
viewport.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0) return;
  if (ev.target.closest('button, a, input')) return;  // 操作要素はパン対象外
  panState = { x: ev.clientX, y: ev.clientY, px: panX, py: panY, moved: false, target: ev.target };
  viewport.setPointerCapture(ev.pointerId);
});
viewport.addEventListener('pointermove', (ev) => {
  if (!panState) return;
  const dx = ev.clientX - panState.x, dy = ev.clientY - panState.y;
  if (!panState.moved && Math.hypot(dx, dy) > 4) {
    panState.moved = true;
    viewport.classList.add('panning');
  }
  if (panState.moved) {
    panX = panState.px + dx; panY = panState.py + dy;
    applyTransform();
  }
});
viewport.addEventListener('pointerup', (ev) => {
  if (!panState) return;
  const wasClick = !panState.moved;
  const target = panState.target;
  panState = null;
  viewport.classList.remove('panning');
  if (wasClick) handleCanvasClick(target);
});
viewport.addEventListener('pointercancel', () => {
  panState = null;
  viewport.classList.remove('panning');
});

// 折りたたみボタンはパン対象外（pointerdownで除外）のため、ネイティブclickで処理する
nodesLayer.addEventListener('click', (ev) => {
  const btn = ev.target.closest('.c-toggle');
  if (!btn) return;
  const clsEl = btn.closest('.cls');
  toggleClass(model.byId.get(clsEl.dataset.cls));
});

function handleCanvasClick(target) {
  const act = target.closest('[data-act]');
  const clsEl = target.closest('.cls');
  if (act && act.dataset.act === 'member-select') {
    const memId = target.closest('.m-row').dataset.mem;
    setSelection(selection && selection.id === memId ? null : { type: 'member', id: memId });
    return;
  }
  if (act && act.dataset.act === 'class-select') {
    const clsId = clsEl.dataset.cls;
    setSelection(selection && selection.id === clsId ? null : { type: 'class', id: clsId });
    openDetail(model.byId.get(clsId));
    return;
  }
  if (clsEl) return;
  setSelection(null);   // 空白クリックで選択解除
}

// ホバーで関連ハイライト（選択が無いときのみ）
nodesLayer.addEventListener('pointerover', (ev) => {
  const clsEl = ev.target.closest('.cls');
  const id = clsEl ? clsEl.dataset.cls : null;
  if (id !== hoverClsId) { hoverClsId = id; if (!selection) styleEdges(); }
});
nodesLayer.addEventListener('pointerout', (ev) => {
  if (!ev.relatedTarget || !ev.relatedTarget.closest || !ev.relatedTarget.closest('.cls')) {
    hoverClsId = null;
    if (!selection) styleEdges();
  }
});

// ---------- フィット・ジャンプ ----------
function contentBounds() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, any = false;
  for (const layer of model.layers) {
    if (layerVisible.get(layer.id) === false || layer.classes.length === 0) continue;
    any = true;
    x0 = Math.min(x0, layer.x); y0 = Math.min(y0, layer.y);
    x1 = Math.max(x1, layer.x + layer.w); y1 = Math.max(y1, layer.y + layer.h);
  }
  for (const cls of model.classes) {
    if (!clsVisible(cls)) continue;
    any = true;
    x0 = Math.min(x0, cls.x); y0 = Math.min(y0, cls.y);
    x1 = Math.max(x1, cls.x + CLASS_W); y1 = Math.max(y1, cls.y + boxH(cls));
  }
  if (!any) return { x0: 0, y0: 0, x1: worldW, y1: worldH };
  return { x0, y0, x1, y1 };
}

function computeFit() {
  const b = contentBounds();
  const bw = Math.max(b.x1 - b.x0, 1), bh = Math.max(b.y1 - b.y0, 1);
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  scale = clamp(Math.min(vw / bw, vh / bh) * 0.92, SCALE_MIN, 1.6);
  panX = (vw - bw * scale) / 2 - b.x0 * scale;
  panY = (vh - bh * scale) / 2 - b.y0 * scale;
}
function fit() {
  // 2パスで確定する: 1パス目のscaleでLODが変わるとクラス箱の高さ（offsetHeight）が
  // 変わるため、切り替え後の高さで外接矩形を取り直す（クラス数が少ないレポートで
  // fit後のscaleがLOD_L2を越えるとコード片の展開ではみ出す問題への対処）
  computeFit();
  applyTransform();
  computeFit();
  applyTransform();
}

function jumpTo(cls, mem) {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  scale = Math.max(scale, 1.3);
  // ジャンプ後のscaleでのLOD・折りたたみ解除を先にDOMへ確定させてから行位置を測る
  // （古いLODのoffsetTop/offsetHeightで計算すると、直後のLOD切替で着地点がずれる）
  if (overrides.get(cls.id) === 0) overrides.delete(cls.id);
  globalLOD = lodForScale(scale);
  applyLevels();
  redrawEdges();
  let cy = cls.y + boxH(cls) / 2;
  if (mem && mem.el && effLevel(cls) >= 1) cy = cls.y + mem.el.offsetTop + mem.el.offsetHeight / 2;
  const cx = cls.x + CLASS_W / 2;
  panX = vw / 2 - cx * scale;
  panY = vh / 2 - cy * scale;
  applyTransform();
  cls.el.classList.remove('pulse');
  void cls.el.offsetWidth;  // アニメーション再始動のためのreflow
  cls.el.classList.add('pulse');
}

// ---------- ミニマップ ----------
const minimap = $('minimap'), mmNodes = $('minimap-nodes'), mmView = $('minimap-view');
const MM_W = 220, MM_H = 140;
let mmScale = 1;
function renderMinimap() {
  mmNodes.textContent = '';
  mmScale = Math.min(MM_W / worldW, MM_H / worldH);
  for (const cls of model.classes) {
    if (!clsVisible(cls)) continue;
    const dot = el('div', 'mm-node');
    dot.style.left = (cls.x * mmScale) + 'px';
    dot.style.top = (cls.y * mmScale) + 'px';
    dot.style.width = Math.max(3, CLASS_W * mmScale) + 'px';
    dot.style.height = Math.max(2.5, boxH(cls) * mmScale) + 'px';
    dot.style.background = cls.layer.palette.dot;
    dot.style.opacity = '0.85';
    mmNodes.appendChild(dot);
  }
  updateMinimapView();
}
function updateMinimapView() {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const wx = -panX / scale, wy = -panY / scale;
  mmView.style.left = (wx * mmScale) + 'px';
  mmView.style.top = (wy * mmScale) + 'px';
  mmView.style.width = (vw / scale * mmScale) + 'px';
  mmView.style.height = (vh / scale * mmScale) + 'px';
}
function mmJump(ev) {
  // minimap自身の矩形基準で座標変換する（ヘッダ分のずれを持ち込まない）
  const rect = minimap.getBoundingClientRect();
  const wx = (ev.clientX - rect.left) / mmScale, wy = (ev.clientY - rect.top) / mmScale;
  panX = viewport.clientWidth / 2 - wx * scale;
  panY = viewport.clientHeight / 2 - wy * scale;
  applyTransform();
}
let mmDrag = false;
minimap.addEventListener('pointerdown', (ev) => { mmDrag = true; minimap.setPointerCapture(ev.pointerId); mmJump(ev); });
minimap.addEventListener('pointermove', (ev) => { if (mmDrag) mmJump(ev); });
minimap.addEventListener('pointerup', () => { mmDrag = false; });
minimap.addEventListener('pointercancel', () => { mmDrag = false; });

// ---------- 検索 ----------
const searchInput = $('search'), searchResults = $('search-results');
let searchIndex = [], searchHits = [], searchActive = -1;
function buildSearchIndex() {
  searchIndex = [];
  for (const cls of model.classes) {
    searchIndex.push({ cls, mem: null, label: cls.label, path: cls.raw.path || '', kindLabel: 'class' });
    for (const mem of cls.members) {
      searchIndex.push({ cls, mem, label: mem.label, path: (cls.raw.path || '') + (mem.raw.lines ? ':' + mem.raw.lines : ''), kindLabel: 'member' });
    }
  }
}
function runSearch(q) {
  searchResults.textContent = '';
  searchActive = -1;
  if (!q) { searchResults.classList.remove('open'); searchHits = []; return; }
  const lq = q.toLowerCase();
  searchHits = searchIndex.filter(it =>
    it.label.toLowerCase().includes(lq) || it.path.toLowerCase().includes(lq) ||
    (it.mem ? it.mem.id : it.cls.id).toLowerCase().includes(lq)
  ).slice(0, 20);
  if (searchHits.length === 0) {
    searchResults.appendChild(el('div', 'sr-item', '一致なし'));
  } else {
    searchHits.forEach((it, i) => {
      const item = el('div', 'sr-item');
      const lb = el('div', 'sr-label');
      lb.appendChild(el('span', 'sr-kind', it.kindLabel));
      lb.appendChild(document.createTextNode(it.mem ? `${it.cls.label} / ${it.label}` : it.label));
      item.appendChild(lb);
      if (it.path) item.appendChild(el('div', 'sr-path', it.path));
      item.addEventListener('pointerdown', (ev) => { ev.preventDefault(); pickSearch(i); });
      searchResults.appendChild(item);
    });
  }
  searchResults.classList.add('open');
}
function pickSearch(i) {
  const it = searchHits[i];
  if (!it) return;
  searchResults.classList.remove('open');
  searchInput.blur();
  if (layerVisible.get(it.cls.layer.id) === false) {
    layerVisible.set(it.cls.layer.id, true);
    syncPanelChecks();
    updateEmphasis(); redrawEdges(); renderMinimap();
  }
  setSelection({ type: it.mem ? 'member' : 'class', id: (it.mem || it.cls).id });
  jumpTo(it.cls, it.mem);
}
searchInput.addEventListener('input', () => runSearch(searchInput.value.trim()));
searchInput.addEventListener('focus', () => { if (searchInput.value.trim()) runSearch(searchInput.value.trim()); });
searchInput.addEventListener('blur', () => setTimeout(() => searchResults.classList.remove('open'), 150));
searchInput.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter') { pickSearch(searchActive >= 0 ? searchActive : 0); ev.preventDefault(); }
  else if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    const items = searchResults.querySelectorAll('.sr-item');
    if (items.length === 0) return;
    searchActive = (searchActive + (ev.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((elm, i) => elm.classList.toggle('active', i === searchActive));
    ev.preventDefault();
  } else if (ev.key === 'Escape') { searchInput.blur(); searchResults.classList.remove('open'); }
});

// ---------- 左パネル（トグル・凡例） ----------
function syncPanelChecks() {
  document.querySelectorAll('#panel input[data-layer]').forEach(cb => {
    cb.checked = layerVisible.get(cb.dataset.layer) !== false;
  });
  document.querySelectorAll('#panel input[data-kind]').forEach(cb => {
    cb.checked = kindVisible.get(cb.dataset.kind) !== false;
  });
}
function renderPanel() {
  const panel = $('panel');
  panel.textContent = '';

  const mkSection = (title, open) => {
    const det = document.createElement('details');
    if (open) det.open = true;
    det.appendChild(el('summary', '', title));
    const body = el('div', 'pbody');
    det.appendChild(body);
    panel.appendChild(det);
    return body;
  };

  const lb = mkSection('レイヤ', true);
  for (const layer of model.layers) {
    const label = el('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true; cb.dataset.layer = layer.id;
    cb.addEventListener('change', () => {
      layerVisible.set(layer.id, cb.checked);
      if (!cb.checked && selection) {
        const node = model.byId.get(selection.id);
        const c = node && (node.kind === 'class' ? node : node.cls);
        if (c && c.layer === layer) setSelection(null);
      }
      updateEmphasis(); redrawEdges(); renderMinimap();
    });
    const sw = el('span', 'sw'); sw.style.background = layer.palette.dot;
    label.appendChild(cb); label.appendChild(sw);
    label.appendChild(el('span', '', `${layer.label} (${layer.classes.length})`));
    lb.appendChild(label);
  }

  const kb = mkSection('関係種別', true);
  const usedKinds = new Set(model.edges.map(e => e.kind));
  for (const [kind, style] of Object.entries(EDGE_KINDS)) {
    if (!usedKinds.has(kind)) continue;
    const label = el('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true; cb.dataset.kind = kind;
    cb.addEventListener('change', () => {
      kindVisible.set(kind, cb.checked);
      redrawEdges(); updateEmphasis();
    });
    const sw = el('span', 'sw-line');
    sw.style.borderTopColor = style.color;
    sw.style.borderTopStyle = style.dash ? 'dashed' : 'solid';
    label.appendChild(cb); label.appendChild(sw);
    label.appendChild(el('span', '', style.label || kind));
    kb.appendChild(label);
  }

  const gb = mkSection('凡例', false);
  const legend = [
    ['#34d399', '追加（+N）'], ['#fbbf24', '変更（+N −M）'], ['#fb7185', '削除（取り消し線）'],
    [COL_UP, '選択の上流（呼び元）'], [COL_DOWN, '選択の下流（呼び先）'],
  ];
  for (const [color, text] of legend) {
    const row = el('div', 'legend-row');
    const sw = el('span', 'sw'); sw.style.background = color;
    row.appendChild(sw); row.appendChild(el('span', '', text));
    gb.appendChild(row);
  }
  const note = el('div', 'legend-row');
  note.appendChild(el('span', '', '集約エッジは太さ＝本数。ホバーで内訳を表示'));
  gb.appendChild(note);
}

// ---------- 詳細パネル ----------
const detail = $('detail'), detailBackdrop = $('detail-backdrop');
const mermaidRendered = new Map();  // クラスid → 描画済みSVG文字列
let mermaidBusy = false, mermaidSeq = 0;

function openDetail(cls) {
  if (!cls || (!cls.raw.detail && !cls.raw.mermaid && !cls.raw.desc)) return;
  $('detail-sub').textContent = cls.layer.label;
  $('detail-title').textContent = cls.label;
  const body = $('detail-body');
  body.textContent = '';
  if (cls.raw.path) {
    const p = el('div', 'd-path');
    p.appendChild(sourceRef(cls.raw.path, cls.raw.lines));
    body.appendChild(p);
  }
  if (cls.raw.desc) body.appendChild(el('div', 'd-text', cls.raw.desc));
  if (cls.raw.detail) body.appendChild(el('div', 'd-text', cls.raw.detail));
  if (cls.raw.mermaid) {
    const box = el('div', 'd-mermaid');
    body.appendChild(box);
    renderMermaid(cls, box);
  }
  detail.classList.add('open');
  detailBackdrop.classList.add('open');
}
function closeDetail() {
  detail.classList.remove('open');
  detailBackdrop.classList.remove('open');
}
$('detail-close').addEventListener('click', closeDetail);
detailBackdrop.addEventListener('click', closeDetail);

async function renderMermaid(cls, box) {
  const src = String(cls.raw.mermaid);
  const fallback = () => {
    box.textContent = '';
    const pre = el('pre', '', src);
    box.appendChild(pre);
    box.appendChild(el('div', 'd-note', '（mermaid.jsを読み込めないためソースを表示）'));
  };
  if (typeof window.mermaid === 'undefined') { fallback(); return; }
  if (mermaidRendered.has(cls.id)) { box.innerHTML = mermaidRendered.get(cls.id); return; }  // 描画済みSVGの再利用
  if (mermaidBusy) { box.appendChild(el('div', 'd-note', '（描画中…もう一度開くと表示されます）')); return; }
  mermaidBusy = true;  // 多重描画ガード: 完了までは新規描画を受け付けない
  try {
    const { svg } = await window.mermaid.render('mmd-' + (++mermaidSeq), src);
    mermaidRendered.set(cls.id, svg);  // mermaid.render生成のSVG（データ文字列はmermaid側でエスケープ済み）
    box.innerHTML = svg;
  } catch (err) {
    fallback();
    box.appendChild(el('div', 'd-note', 'mermaid構文エラー: ' + (err && err.message ? err.message : err)));
  } finally {
    mermaidBusy = false;
  }
}

// ---------- キーボード ----------
document.addEventListener('keydown', (ev) => {
  const typing = ev.target === searchInput;
  if (ev.key === 'Escape') {
    if (detail.classList.contains('open')) { closeDetail(); return; }
    if (searchResults.classList.contains('open')) { searchResults.classList.remove('open'); return; }
    overrides.clear();
    setSelection(null);
    applyLevels();
    redrawEdges();
  } else if (!typing && (ev.key === 'f' || ev.key === 'F')) {
    fit();
  } else if (!typing && ev.key === '/') {
    ev.preventDefault();
    searchInput.focus();
    searchInput.select();
  }
});

// ---------- ボタン ----------
$('btn-zin').addEventListener('click', () =>
  zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2 + 56, 1.25));
$('btn-zout').addEventListener('click', () =>
  zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2 + 56, 1 / 1.25));
$('btn-fit').addEventListener('click', fit);
window.addEventListener('resize', () => applyTransform());

// ---------- 起動 ----------
try {
  if (typeof window.mermaid !== 'undefined') {
    window.mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'strict' });
  }
  const meta = (CANVAS_DATA && CANVAS_DATA.meta) || {};
  if (meta.title) document.title = meta.title;
  $('hdr-title').textContent = meta.title || '(meta.title 未設定)';
  $('hdr-sub').textContent = meta.subtitle || '';

  validateAndBuild(CANVAS_DATA);
  renderErrors();
  model.layers.forEach(l => layerVisible.set(l.id, true));
  Object.keys(EDGE_KINDS).forEach(k => kindVisible.set(k, true));
  layout();            // 1回目: 概算高さで仮配置（帯サイズの算出に必要）
  renderLayers();
  renderClasses();
  measureHeights();    // L1状態の実高さを測定（ラベル折り返し等の概算とのずれを吸収）
  layout();            // 2回目: 実測高さで配置し直す（重なり防止）
  syncLayoutDom();
  renderPanel();
  buildSearchIndex();
  fit();               // ここでglobalLODも確定する
  applyLevels();
  redrawEdges();
  renderMinimap();
} catch (err) {
  fatal(err);
}

})();
</script>
</body>
</html>
